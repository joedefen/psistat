[build-system]
requires = ["flit_core >=3.9,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "psistat"

[project]
name = "psistat"
dynamic = ["version"]
description = "psistat - A simple command-line system status tool."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}

dependencies = [
    'console-window ~= 3.1.0',
]

authors = [
    {name = "Joe Defen", email = "joedef@duck.com"},
]

#  Update classifiers to match your project
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: System :: Monitoring",
]

keywords = ["system", "status", "cli"]

[project.scripts]
psistat = "psistat:main"