# psistat -- packaging, the test gate and the release gate
# =========================================================
#
# Sources of truth
# ----------------
# * Build backend: flit_core. The release number lives in
#   `psistat/__init__.py:__version__` only; never add `version =` to [project].
#   `dynamic = ["version"]` is what makes flit read that one line, and it is
#   the line `bless` reads without importing the package.
# * Layout: the package is `psistat/` at the root and `psistat` is the console
#   script (`psistat:main`). `./runner` runs the same tree from source under
#   `.venv/bin/python` for debugging, without installing anything or taking
#   over `~/.local/bin`.
#
# The gates
# ---------
# CI and `./bless` run the same three commands on the interpreter that holds
# the dev extra -- not equivalents, so a green gate means the same thing in
# both places:
#
#   python -m ruff check .
#   python -m compileall -q psistat tests
#   python -m pytest -q --cov=psistat --cov-report=term-missing
#
# The toolchain lives in the checkout's virtualenv, which is also the
# interpreter `./bless` must run under. Build it with `bt`, which installs this
# package editable plus the `dev` extra and the gate's tool floors; nothing
# here uses `pip --user`:
#
#   bt penv            # rebuilds .venv around the tree
#   .venv/bin/python ./bless
#
# Releasing
# ---------
# `./bless` is the only path to an upload and it takes no argument and no flag.
# Every run runs the whole gate, prints what it is holding, and only then asks
# `====> Enter test or publish or quit:`. `test` rehearses on test.pypi.org
# with a throwaway X.Y.Z.99.N built from a copy of the tree; `publish` tags
# vX.Y.Z, uploads the two inspected files to PyPI and pushes. See
# tests/README-DEV.md here, and ../../blessd/docs/release-strategy.md for the
# strategy every project shares.

[build-system]
# Upper bound matters: flit_core 4.x writes Metadata 2.5, which only
# twine >= 7 and packaging >= 26 accept -- exactly the floors in the dev extra
# and the ones `./bless` refuses below.
requires = ["flit_core >=3.9,<5"]
build-backend = "flit_core.buildapi"

# ----------------------------------------------------------------------
# FLIT MODULE CONFIGURATION
# Flit looks for the package directory named psistat
[tool.flit.module]
name = "psistat"

# ----------------------------------------------------------------------
# UNIFIED PROJECT METADATA
[project]
name = "psistat"
# The release number lives in `psistat/__init__.py` (`__version__`). This table
# only declares where it comes from, so `bless`, the built artifacts and
# `psistat --version` all report the same string.
dynamic = ["version"]
description = "psistat - A simple command-line system status tool."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}

# Add dependencies here if you use non-stdlib PyPI packages (e.g., requests, rich)
dependencies = [
    'console-window == 2.2.2',
]

authors = [
    {name = "Joe Defen", email = "joedef@duck.com"}, # ✏️ Your info
]

# ✏️ Update classifiers to match your project
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Topic :: System :: Monitoring",
]

keywords = ["system", "status", "cli"] # ✏️ Add relevant keywords

# ----------------------------------------------------------------------
# COMMAND LINE SCRIPTS
# This tells flit to create an executable 'psistat' command
# that calls the 'main()' function in the 'psistat' package
[project.scripts]
psistat = "psistat:main"

# ----------------------------------------------------------------------
# DEVELOPMENT TOOLING
# Build it with `bt penv` (editable install of this tree plus this extra).
# `./bless` refuses to start unless twine and packaging meet its own floors,
# so the same floors are declared here.
[project.optional-dependencies]
dev = [
    "pytest >= 8",
    "pytest-cov >= 4",
    "ruff >= 0.6",
    "build >= 1.2",
    "twine >= 7",
    "packaging >= 26",
]

[tool.bless]
# The branch model `./bless` keeps. `["main"]` releases from the trunk alone;
# `["main", "dev"]` -- the default when this table says nothing -- aligns a
# development branch with the trunk before tagging. This project releases from
# `main` only, so a small change can be published without creating `dev` first.
branches = ["main"]

# The rest is derived rather than written here: the distribution name comes
# from `[project] name` ("psistat"), the package holding `__version__` from
# that name with `-` and `.` turned into `_` ("psistat"), the console script
# from the first `[project.scripts]` entry ("psistat") and the inspector from
# `tests/inspect_dist.py`. Only a project that differs needs `module`,
# `inspect`, `smoke_args` or `smoke_expect` written down here.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["psistat", "tests"]
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "PLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
# src pins the measured package no matter which directory pytest is started
# from, so the number the release gate prints is reproducible.
source = ["psistat"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
