name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The same three commands `./bless` runs, in the same order, never an
      # equivalent: a green CI result and a green gate mean the same thing.
      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Compile (compileall)
        run: python -m compileall -q psistat tests

      - name: Test (pytest with coverage)
        run: python -m pytest -q --cov=psistat --cov-report=term-missing

      # The same inspector `./bless` refuses to upload without.
      - name: Build and inspect the distributions
        run: |
          python -m build --outdir dist .
          python tests/inspect_dist.py dist/*.whl dist/*.tar.gz
